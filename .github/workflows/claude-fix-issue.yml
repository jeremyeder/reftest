name: Claude Fix Issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'claude-fix' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get issue details
        id: issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          ISSUE_DATA=$(gh issue view "$ISSUE_NUM" --json title,body,labels)
          echo "title=$(echo "$ISSUE_DATA" | jq -r '.title')" >> $GITHUB_OUTPUT
          echo "number=$ISSUE_NUM" >> $GITHUB_OUTPUT

          # Save body to file to handle multiline
          echo "$ISSUE_DATA" | jq -r '.body' > /tmp/issue_body.txt

      - name: Create branch
        id: branch
        env:
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
        run: |
          BRANCH_NAME="claude-fix-${ISSUE_NUM}-$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | head -c 30)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Run Claude to fix issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
        run: |
          ISSUE_BODY=$(cat /tmp/issue_body.txt)

          # Construct prompt for Claude
          PROMPT="You are fixing GitHub issue: $ISSUE_TITLE

          Issue description:
          $ISSUE_BODY

          Instructions:
          1. Analyze the issue and determine what code changes are needed
          2. Make the necessary changes to fix the issue
          3. Ensure changes follow the project's coding standards
          4. Do not modify unrelated code

          Please fix this issue now."

          # Run Claude Code in non-interactive mode
          echo "$PROMPT" | claude --dangerously-skip-permissions -p --output-format stream-json 2>&1 | tee /tmp/claude_output.log || true

          # Check if any files were modified
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes made by Claude"
            echo "CHANGES_MADE=false" >> $GITHUB_ENV
          else
            echo "Claude made changes"
            echo "CHANGES_MADE=true" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        if: env.CHANGES_MADE == 'true'
        env:
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git add -A
          git commit -m "fix: Address issue #${ISSUE_NUM}

          Changes made by Claude Code to fix the reported issue.

          Co-Authored-By: Claude <noreply@anthropic.com>"

          git push -u origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: env.CHANGES_MADE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          PR_URL=$(gh pr create \
            --title "fix: $ISSUE_TITLE" \
            --body "## Summary
          Automated fix for #${ISSUE_NUM}

          ## Changes
          This PR was created by Claude Code to address the issue.

          ## Test Plan
          - [ ] Review changes
          - [ ] Run tests
          - [ ] Verify fix addresses the issue

          ---
          🤖 Generated by Claude Code" \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          # Comment on the issue
          gh issue comment "$ISSUE_NUM" --body "🤖 I've created a pull request to address this issue: $PR_URL

          Please review the changes and let me know if any adjustments are needed."

      - name: Comment if no changes
        if: env.CHANGES_MADE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "🤖 I analyzed this issue but couldn't determine specific code changes to make.

          This might be because:
          - The issue requires more context or clarification
          - The fix requires changes I'm not confident about
          - The issue may already be resolved

          Please provide more details or assign to a human developer."
